on:
  issues:
    types: [opened, reopened, labeled, edited]

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: acr-deployment-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  deploy-acr:
    name: Validate, Plan and Apply
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'azure-acr-deployment')

    runs-on: ubuntu-latest
    environment: acr-deployment

    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse and validate Issue Form
        id: inputs
        uses: actions/github-script@v7
        env:
          SUB_FAAS_NON_PROD: ${{ vars.SUB_FAAS_NON_PROD }}
          SUB_FAAS_PROD: ${{ vars.SUB_FAAS_PROD }}
          SUB_DAAS_NON_PROD: ${{ vars.SUB_DAAS_NON_PROD }}
          SUB_DAAS_PROD: ${{ vars.SUB_DAAS_PROD }}
          SUB_AZURE_1: ${{ vars.SUB_AZURE_1 }}
        with:
          script: |
            const fs = require('fs');
            const body = context.payload.issue.body || '';

            const fields = {};
            let current = null;

            for (const line of body.split(/\r?\n/)) {
              const heading = line.match(/^###\s+(.+?)(?:\s+\*)?\s*$/);

              if (heading) {
                current = heading[1].trim().toLowerCase().replace(/\s+/g, '_');
                fields[current] = [];
              } else if (current) {
                fields[current].push(line);
              }
            }

            for (const key of Object.keys(fields)) {
              fields[key] = fields[key].join('\n').trim();
              if (fields[key] === '_No response_') fields[key] = '';
            }

            const get = (key) => fields[key] || '';

            const required = [
              'ritm', 'dso', 'subscription_id',
              'resource_group_name', 'acr_name', 'location',
              'network_access', 'public_network_access',
              'domain_label_scope', 'sku',
              'role_assignment_permissions'
            ];

            const errors = [];

            for (const key of required) {
              if (!get(key)) errors.push(`Missing: ${key}`);
            }

            if (!/^RITM\d+$/i.test(get('ritm'))) {
              errors.push('RITM must follow the format RITM1234567.');
            }

            if (!['Client', 'Selftest'].includes(get('dso'))) {
              errors.push('Invalid DSO.');
            }

            const acr = get('acr_name');

            if (
              acr &&
              !/^az\d{2}[a-z0-9]+acr\d{2}(dev|test|uat|prod)$/.test(acr)
            ) {
              errors.push('ACR name does not match the requested naming format.');
            }

            // Issue form text can contain Markdown code fences; remove fence lines
            // before validating the actual IPv4/CIDR values.
            const allowedIpRanges = get('allowed_ip_ranges')
              .replace(/^\s*```[^\r\n]*\r?\n?/gm, '')
              .replace(/^\s*```\s*$/gm, '')
              .trim();

            const ips = allowedIpRanges
              .split(/\r?\n/)
              .map(x => x.trim())
              .filter(Boolean);

            const ipPattern =
              /^(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\/(?:[0-9]|[12]\d|3[0-2]))?$/;

            for (const ip of ips) {
              if (!ipPattern.test(ip)) {
                errors.push(`Invalid IPv4 address/CIDR: ${ip}`);
              }
            }

            if (
              get('public_network_access') === 'Selected networks' &&
              ips.length === 0
            ) {
              errors.push('Selected networks requires at least one allowed IP range.');
            }

            if (
              get('public_network_access') !== 'Selected networks' &&
              ips.length > 0
            ) {
              errors.push('Allowed IP ranges must be blank unless Selected networks is selected.');
            }

            if (
              get('network_access') === 'Private Endpoint' &&
              get('public_network_access') !== 'Disabled'
            ) {
              errors.push('Private Endpoint requests must set public network access to Disabled.');
            }

            const subscriptions = {
              'FAAST NON_PROD': process.env.SUB_FAAS_NON_PROD,
              'FAAST PROD': process.env.SUB_FAAS_PROD,
              'Data & Analysis PaaS Non-Prod': process.env.SUB_DAAS_NON_PROD,
              'Data & Analysis PaaS Prod': process.env.SUB_DAAS_PROD,
              'Azure Subscription 1': process.env.SUB_AZURE_1
            };

            const selectedSubscription = get('subscription_id');
            const subscriptionId = (subscriptions[selectedSubscription] || '').trim();
            const subscriptionVariableNames = {
              'FAAST NON_PROD': 'SUB_FAAS_NON_PROD',
              'FAAST PROD': 'SUB_FAAS_PROD',
              'Data & Analysis PaaS Non-Prod': 'SUB_DAAS_NON_PROD',
              'Data & Analysis PaaS Prod': 'SUB_DAAS_PROD',
              'Azure Subscription 1': 'SUB_AZURE_1'
            };

            if (!Object.prototype.hasOwnProperty.call(subscriptions, selectedSubscription)) {
              errors.push(`Unknown subscription option: "${selectedSubscription}". Check the Issue Form option and subscription mapping.`);
            } else if (!subscriptionId) {
              errors.push(`Selected subscription "${selectedSubscription}" is missing its GitHub Actions repository/environment variable: ${subscriptionVariableNames[selectedSubscription]}. Configure it under Settings → Secrets and variables → Actions → Variables (or the acr-deployment environment variables).`);
            } else if (
              !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(subscriptionId)
            ) {
              errors.push('Configured subscription ID is not a valid GUID.');
            }

            const locations = {
              'East US': 'eastus',
              'West US': 'westus',
              'Central US': 'centralus',
              'Central India': 'centralindia',
              'North Europe': 'northeurope',
              'West Europe': 'westeurope',
              'UK South': 'uksouth',
              'Southeast Asia': 'southeastasia',
              'Australia East': 'australiaeast'
            };

            const scopes = {
              'Unsecure': 'Unsecure',
              'Tenant Reuse': 'TenantReuse',
              'Subscription Reuse': 'SubscriptionReuse',
              'Resource Group Reuse': 'ResourceGroupReuse',
              'No Reuse': 'NoReuse'
            };

            const roleModes = {
              'RBAC Registry + ABAC Repository Permissions': 'AbacRepositoryPermissions',
              'RBAC Registry Permissions': 'LegacyRegistryPermissions'
            };

            if (!locations[get('location')]) errors.push('Invalid location.');
            if (!scopes[get('domain_label_scope')]) errors.push('Invalid domain label scope.');

            if (!['Basic', 'Standard', 'Premium'].includes(get('sku'))) {
              errors.push('Invalid SKU.');
            }

            if (!roleModes[get('role_assignment_permissions')]) {
              errors.push('Invalid role assignment mode.');
            }

            if (!['All networks', 'Selected networks', 'Disabled'].includes(get('public_network_access'))) {
              errors.push('Invalid public network access selection.');
            }

            if (errors.length) {
              core.setFailed(errors.join('\n'));
              return;
            }

            const zones = /-\s*\\[x\\]\s*Enable Availability Zones/i
              .test(get('availability_zones'));

            const tfvars = {
              ritm: get('ritm'),
              dso: get('dso'),
              subscription_id: subscriptionId,
              resource_group_name: get('resource_group_name'),
              acr_name: acr,
              location: locations[get('location')],
              network_access: get('network_access'),
              public_network_access: get('public_network_access'),
              allowed_ip_ranges: ips,
              domain_label_scope: scopes[get('domain_label_scope')],
              availability_zones: zones,
              sku: get('sku'),
              role_assignment_mode: roleModes[get('role_assignment_permissions')]
            };

            fs.writeFileSync(
              'terraform.tfvars.json',
              JSON.stringify(tfvars, null, 2)
            );

            core.setOutput('subscription_id', subscriptionId);
            core.setOutput('acr_name', acr);

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.inputs.outputs.subscription_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: deployment/Azure_Container_Registry
        run: terraform init

      - name: Stage 1 - Validate
        working-directory: deployment/Azure_Container_Registry
        run: |
          terraform fmt -check -recursive
          terraform validate

      - name: Stage 2 - Plan
        working-directory: deployment/Azure_Container_Registry
        run: |
          terraform plan \\
            -var-file="${GITHUB_WORKSPACE}/terraform.tfvars.json" \\
            -out=tfplan

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: acr-tfplan
          path: deployment/Azure_Container_Registry/tfplan
          retention-days: 1

      - name: Stage 3 - Apply
        working-directory: deployment/Azure_Container_Registry
        run: terraform apply -auto-approve tfplan

      - name: Report result on Issue
        if: always()
        uses: actions/github-script@v7
        env:
          ACR_NAME: ${{ steps.inputs.outputs.acr_name }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === 'success';

            const message = success
              ? `Terraform deployment completed successfully for ACR: ${process.env.ACR_NAME || 'requested ACR'}.`
              : 'ACR deployment workflow failed. Check the Actions logs for the failing step.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
