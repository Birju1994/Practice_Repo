
name: Azure Container Registry Deployment

on:
  workflow_dispatch:
    inputs:
      ritm:
        description: "RITM number for audit traceability"
        required: true
        type: string
        default: RITM1234567
      subscription_id:
        description: "Select the Azure subscription"
        required: true
        type: choice
        options:
          - Azure Subscription 1
          - FAAST NON_PROD
          - FAAST PROD
          - Data & Analysis PaaS Non-Prod
          - Data & Analysis PaaS Prod

      resource_group_name:
        description: "Existing Azure Resource Group name"
        required: true
        type: string
        default: GITHUB-AZURE-TEST-RG

      acr_name:
        description: "Globally unique ACR name"
        required: true
        type: string
        default: az26githubacr01dev

      location:
        description: "Azure region"
        required: true
        type: choice
        options:
          - East US
          - West US
          - Central US
          - North Europe
          - West Europe
          - UK South
          - Southeast Asia
          - Australia East

      sku:
        description: "ACR SKU"
        required: true
        type: choice
        options:
          - Basic
          - Standard
          - Premium

      availability_zones:
        description: "Enable zone redundancy (Premium only)"
        required: true
        type: boolean
        default: false

      domain_label_scope:
        description: "ACR domain label scope"
        required: true
        type: choice
        options:
          - Unsecure
          - Tenant Reuse
          - Subscription Reuse
          - Resource Group Reuse
          - No Reuse

      role_assignment_permissions:
        description: "Repository authorization model"
        required: true
        type: choice
        options:
          - RBAC Registry + ABAC Repository Permissions
          - RBAC Registry Permissions

  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: acr-deployment-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: ${{ vars.TERRAFORM_WORKING_DIRECTORY || 'Azure_Container_Registry/deployment' }}

jobs:

  # ---------------------------------------------------------
  # JOB 1: Collect and validate issue/manual inputs
  # ---------------------------------------------------------
  collect-inputs:
    name: Collect and validate deployment inputs
    runs-on: self-hosted

    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        github.event.label.name == 'azure-acr-deployment'
      )

    outputs:
      ritm: ${{ steps.inputs.outputs.ritm }}
      subscription_name: ${{ steps.inputs.outputs.subscription_name }}
      resource_group_name: ${{ steps.inputs.outputs.resource_group_name }}
      acr_name: ${{ steps.inputs.outputs.acr_name }}
      location: ${{ steps.inputs.outputs.location }}
      sku: ${{ steps.inputs.outputs.sku }}
      availability_zones: ${{ steps.inputs.outputs.availability_zones }}
      domain_label_scope: ${{ steps.inputs.outputs.domain_label_scope }}
      role_assignment_permissions: ${{ steps.inputs.outputs.role_assignment_permissions }}

    steps:
      - name: Read and validate inputs
        id: inputs
        shell: bash

        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}

          MANUAL_RITM: ${{ inputs.ritm }}
          MANUAL_SUBSCRIPTION: ${{ inputs.subscription_id }}
          MANUAL_RG: ${{ inputs.resource_group_name }}
          MANUAL_ACR: ${{ inputs.acr_name }}
          MANUAL_LOCATION: ${{ inputs.location }}
          MANUAL_SKU: ${{ inputs.sku }}
          MANUAL_ZONES: ${{ inputs.availability_zones }}
          MANUAL_DOMAIN: ${{ inputs.domain_label_scope }}
          MANUAL_ROLE: ${{ inputs.role_assignment_permissions }}

        run: |
          set -euo pipefail

          # Parse the exact headings generated by the GitHub issue form.
          get_value() {
            local field="$1"

            printf '%s\n' "$ISSUE_BODY" | awk -v field="$field" '
              $0 == "### " field {
                while (getline > 0) {
                  if ($0 ~ /^### /) exit

                  if ($0 !~ /^[[:space:]]*$/) {
                    sub(/^[[:space:]]+/, "")
                    sub(/[[:space:]]+$/, "")
                    print
                    exit
                  }
                }
              }
            '
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RITM="$MANUAL_RITM"
            SUBSCRIPTION="$MANUAL_SUBSCRIPTION"
            RG="$MANUAL_RG"
            ACR="$MANUAL_ACR"
            LOCATION="$MANUAL_LOCATION"
            SKU="$MANUAL_SKU"
            ZONES="$MANUAL_ZONES"
            DOMAIN="$MANUAL_DOMAIN"
            ROLE="$MANUAL_ROLE"
          else
            RITM="$(get_value 'ritm')"
            SUBSCRIPTION="$(get_value 'subscription_id')"
            RG="$(get_value 'resource_group_name')"
            ACR="$(get_value 'acr_name')"
            LOCATION="$(get_value 'location')"
            SKU="$(get_value 'sku')"
            DOMAIN="$(get_value 'domain_label_scope')"
            ROLE="$(get_value 'role_assignment_permissions')"

            if printf '%s\n' "$ISSUE_BODY" |
              grep -qiE '^- \[x\] Enable Availability Zones$'; then
              ZONES=true
            else
              ZONES=false
            fi
          fi

          # Required inputs
          for field in RITM SUBSCRIPTION RG ACR LOCATION SKU DOMAIN ROLE; do
            value="${!field}"

            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "ERROR: $field is required." >&2
              exit 1
            fi
          done

          # Normalize the subscription alias.
          case "$SUBSCRIPTION" in
            "Azure Subscription 1") ;;
            "FAAST NON_PROD") ;;
            "FAAST PROD") ;;
            "Data & Analysis PaaS Non-Prod") ;;
            "Data & Analysis PaaS Prod") ;;
            *)
              echo "ERROR: Unsupported subscription alias." >&2
              exit 1
              ;;
          esac

          # Validate SKU.
          case "$SKU" in
            Basic|Standard|Premium) ;;
            *)
              echo "ERROR: Invalid ACR SKU." >&2
              exit 1
              ;;
          esac

          # Validate ACR name.
          [[ "$ACR" =~ ^[a-z0-9]{5,50}$ ]] || {
            echo "ERROR: ACR name must contain 5-50 lowercase letters/numbers." >&2
            exit 1
          }

          # Validate availability zones.
          [[ "$ZONES" == "true" || "$ZONES" == "false" ]] || {
            echo "ERROR: Availability zones must be true or false." >&2
            exit 1
          }

          if [[ "$ZONES" == "true" && "$SKU" != "Premium" ]]; then
            echo "ERROR: Zone redundancy requires Premium SKU." >&2
            exit 1
          fi

          # Validate domain label scope.
          case "$DOMAIN" in
            "Unsecure"|"Tenant Reuse"|"Subscription Reuse"|"Resource Group Reuse"|"No Reuse") ;;
            *)
              echo "ERROR: Invalid domain label scope." >&2
              exit 1
              ;;
          esac

          # Validate repository authorization selection.
          case "$ROLE" in
            "RBAC Registry + ABAC Repository Permissions"|"RBAC Registry Permissions") ;;
            *)
              echo "ERROR: Invalid role assignment permissions mode." >&2
              exit 1
              ;;
          esac

          # Convert friendly Azure regions to canonical location names.
          case "$LOCATION" in
            "East US") LOCATION="eastus" ;;
            "West US") LOCATION="westus" ;;
            "Central US") LOCATION="centralus" ;;
            "North Europe") LOCATION="northeurope" ;;
            "West Europe") LOCATION="westeurope" ;;
            "UK South") LOCATION="uksouth" ;;
            "Southeast Asia") LOCATION="southeastasia" ;;
            "Australia East") LOCATION="australiaeast" ;;
            *)
              echo "ERROR: Unsupported Azure region." >&2
              exit 1
              ;;
          esac

          # Publish values to subsequent jobs.
          {
            echo "ritm=$RITM"
            echo "subscription_name=$SUBSCRIPTION"
            echo "resource_group_name=$RG"
            echo "acr_name=$ACR"
            echo "location=$LOCATION"
            echo "sku=$SKU"
            echo "availability_zones=$ZONES"
            echo "domain_label_scope=$DOMAIN"
            echo "role_assignment_permissions=$ROLE"
          } >> "$GITHUB_OUTPUT"

          echo "Input validation passed for $RITM."

  # ---------------------------------------------------------
  # JOB 2: Resolve selected subscription alias to subscription ID
  # ---------------------------------------------------------
  resolve-subscription:
    name: Resolve Azure subscription
    runs-on: self-hosted
    needs: collect-inputs

    outputs:
      subscription_id: ${{ steps.map.outputs.subscription_id }}

    steps:
      - name: Map subscription alias to Azure subscription ID
        id: map
        shell: bash

        env:
          SELECTED_SUBSCRIPTION: ${{ needs.collect-inputs.outputs.subscription_name }}

          SUB_AZURE_1: ${{ secrets.AZURE_SUBSCRIPTION_1_ID }}
          SUB_FAAST_NONPROD: ${{ secrets.FAAST_NONPROD_SUBSCRIPTION_ID }}
          SUB_FAAST_PROD: ${{ secrets.FAAST_PROD_SUBSCRIPTION_ID }}
          SUB_DATA_NONPROD: ${{ secrets.DATA_PAAS_NONPROD_SUBSCRIPTION_ID }}
          SUB_DATA_PROD: ${{ secrets.DATA_PAAS_PROD_SUBSCRIPTION_ID }}

        run: |
          set -euo pipefail

          case "$SELECTED_SUBSCRIPTION" in
            "Azure Subscription 1")
              SUBSCRIPTION_ID="$SUB_AZURE_1"
              ;;
            "FAAST NON_PROD")
              SUBSCRIPTION_ID="$SUB_FAAST_NONPROD"
              ;;
            "FAAST PROD")
              SUBSCRIPTION_ID="$SUB_FAAST_PROD"
              ;;
            "Data & Analysis PaaS Non-Prod")
              SUBSCRIPTION_ID="$SUB_DATA_NONPROD"
              ;;
            "Data & Analysis PaaS Prod")
              SUBSCRIPTION_ID="$SUB_DATA_PROD"
              ;;
            *)
              echo "ERROR: Unsupported subscription alias." >&2
              exit 1
              ;;
          esac

          [[ -n "$SUBSCRIPTION_ID" ]] || {
            echo "ERROR: Selected subscription ID secret is empty." >&2
            exit 1
          }

          [[ "$SUBSCRIPTION_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || {
            echo "ERROR: Selected subscription ID is not a valid GUID." >&2
            exit 1
          }

          echo "subscription_id=$SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------
  # JOB 3: Terraform init and validate
  # ---------------------------------------------------------
  terraform-init:
    name: Terraform init and validate
    runs-on: self-hosted

    needs: [collect-inputs, resolve-subscription]

    environment:
      name: ${{ vars.AZURE_WORK_ENVIRONMENT || 'azure-acr-nonprod' }}

    permissions:
      contents: read
      id-token: write

    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ needs.resolve-subscription.outputs.subscription_id }}

      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
      TFSTATE_KEY: ${{ vars.TFSTATE_KEY || 'acr-nonprod.tfstate' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || '1.9.8' }}
          terraform_wrapper: false

      - name: Check required tools
        shell: bash
        run: |
          set -euo pipefail
          terraform version
          command -v unzip >/dev/null || {
            echo "ERROR: Install unzip on the self-hosted runner." >&2
            exit 1
          }

      - name: Terraform init and validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          : "${ARM_CLIENT_ID:?Missing AZURE_CLIENT_ID secret}"
          : "${ARM_TENANT_ID:?Missing AZURE_TENANT_ID secret}"
          : "${ARM_SUBSCRIPTION_ID:?Missing selected subscription ID}"
          : "${TFSTATE_RESOURCE_GROUP:?Missing TFSTATE_RESOURCE_GROUP variable}"
          : "${TFSTATE_STORAGE_ACCOUNT:?Missing TFSTATE_STORAGE_ACCOUNT variable}"
          : "${TFSTATE_CONTAINER:?Missing TFSTATE_CONTAINER variable}"
          : "${TFSTATE_KEY:?Missing TFSTATE_KEY variable}"

          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=$TFSTATE_KEY" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="tenant_id=$ARM_TENANT_ID" \
            -backend-config="client_id=$ARM_CLIENT_ID" \
            -backend-config="subscription_id=$ARM_SUBSCRIPTION_ID"

          terraform fmt -check -recursive
          terraform validate

  # ---------------------------------------------------------
  # JOB 4: Generate Terraform plan
  # ---------------------------------------------------------
  terraform-plan:
    name: Terraform plan
    runs-on: self-hosted

    needs: [collect-inputs, resolve-subscription, terraform-init]

    environment:
      name: ${{ vars.AZURE_WORK_ENVIRONMENT || 'azure-acr-nonprod' }}

    permissions:
      contents: read
      id-token: write

    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ needs.resolve-subscription.outputs.subscription_id }}

      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
      TFSTATE_KEY: ${{ vars.TFSTATE_KEY || 'acr-nonprod.tfstate' }}

      # These variable names must match deployment/variable.tf.
      TF_VAR_resource_group_name: ${{ needs.collect-inputs.outputs.resource_group_name }}
      TF_VAR_location: ${{ needs.collect-inputs.outputs.location }}
      TF_VAR_acr_name: ${{ needs.collect-inputs.outputs.acr_name }}
      TF_VAR_sku_name: ${{ needs.collect-inputs.outputs.sku }}
      TF_VAR_zone_redundancy_enabled: ${{ needs.collect-inputs.outputs.availability_zones }}

      TF_VAR_admin_enabled: "false"
      TF_VAR_public_network_access_enabled: "true"
      TF_VAR_identity_type: "SystemAssigned"
      TF_VAR_tags: '{"managed_by":"github-actions","environment":"nonprod"}'

      # Declare and wire these variables in the Terraform root module
      # and child module before using these two settings.
      TF_VAR_domain_label_scope: ${{ needs.collect-inputs.outputs.domain_label_scope }}
      TF_VAR_role_assignment_permissions: ${{ needs.collect-inputs.outputs.role_assignment_permissions }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || '1.9.8' }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=$TFSTATE_KEY" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="tenant_id=$ARM_TENANT_ID" \
            -backend-config="client_id=$ARM_CLIENT_ID" \
            -backend-config="subscription_id=$ARM_SUBSCRIPTION_ID"

      - name: Create Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          REQUEST_RITM: ${{ needs.collect-inputs.outputs.ritm }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Creating plan for RITM: $REQUEST_RITM"

          terraform plan \
            -input=false \
            -lock-timeout=5m \
            -out=tfplan

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: acr-terraform-plan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------
  # JOB 5: Apply the saved plan after environment approval
  # ---------------------------------------------------------
  terraform-apply:
    name: Terraform apply (protected)
    runs-on: self-hosted

    needs: [collect-inputs, resolve-subscription, terraform-plan]

    environment:
      name: ${{ vars.AZURE_APPLY_ENVIRONMENT || 'azure-acr-nonprod-apply' }}

    permissions:
      contents: read
      id-token: write

    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ needs.resolve-subscription.outputs.subscription_id }}

      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
      TFSTATE_KEY: ${{ vars.TFSTATE_KEY || 'acr-nonprod.tfstate' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || '1.9.8' }}
          terraform_wrapper: false

      - name: Download saved Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: acr-terraform-plan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          : "${ARM_CLIENT_ID:?Missing AZURE_CLIENT_ID secret}"
          : "${ARM_TENANT_ID:?Missing AZURE_TENANT_ID secret}"
          : "${ARM_SUBSCRIPTION_ID:?Missing selected subscription ID}"

          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=$TFSTATE_KEY" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="tenant_id=$ARM_TENANT_ID" \
            -backend-config="client_id=$ARM_CLIENT_ID" \
            -backend-config="subscription_id=$ARM_SUBSCRIPTION_ID"

      - name: Apply reviewed Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -f tfplan || {
            echo "ERROR: Saved Terraform plan was not found." >&2
            exit 1
          }

          terraform apply \
            -input=false \
            -lock-timeout=5m \
            tfplan

  # ---------------------------------------------------------
  # JOB 6: Report the result on the issue
  # ---------------------------------------------------------
  issue-result:
    name: Update issue with deployment result
    runs-on: self-hosted

    if: >-
      always() &&
      github.event_name == 'issues' &&
      needs.collect-inputs.result == 'success'

    needs: [collect-inputs, terraform-apply]

    permissions:
      issues: write
      contents: read

    steps:
      - name: Comment deployment result
        uses: actions/github-script@v7
        env:
          APPLY_RESULT: ${{ needs.terraform-apply.result }}
          RITM: ${{ needs.collect-inputs.outputs.ritm }}
          ACR: ${{ needs.collect-inputs.outputs.acr_name }}
          RG: ${{ needs.collect-inputs.outputs.resource_group_name }}
        with:
          script: |
            const succeeded = process.env.APPLY_RESULT === 'success';

            const body = [
              `## Azure Container Registry deployment ${succeeded ? 'succeeded' : 'failed'}`,
              '',
              `- **RITM:** ${process.env.RITM}`,
              `- **ACR:** ${process.env.ACR}`,
              `- **Resource Group:** ${process.env.RG}`,
              `- **Status:** ${process.env.APPLY_RESULT}`,
              `- **Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
