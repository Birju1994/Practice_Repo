name: Azure Container Registry Deployment

on:
  workflow_dispatch:
    inputs:
      ritm:
        description: "RITM number for audit traceability"
        required: true
        type: string
        default: RITM1234567
      subscription_id:
        description: "Azure subscription alias (only Azure subscription 1 is configured currently)"
        required: true
        type: choice
        options:
          - Azure subscription 1
          - FAAST NON_PROD
          - FAAST PROD
          - Data & Analysis PaaS Non-Prod
          - Data & Analysis PaaS Prod
      resource_group_name:
        description: "Existing Azure Resource Group name"
        required: true
        type: string
        default: GITHUB-AZURE-TEST-RG
      acr_name:
        description: "Globally unique ACR name: 5-50 lowercase letters/numbers"
        required: true
        type: string
        default: az2601githubbrij01dev
      location:
        description: "Azure region"
        required: true
        type: choice
        options:
          - East US
          - West US
          - Central US
          - North Europe
          - West Europe
          - UK South
          - Southeast Asia
          - Australia East
      domain_label_scope:
        description: "ACR domain label scope"
        required: true
        type: choice
        options:
          - Unsecure
          - Tenant Reuse
          - Subscription Reuse
          - Resource Group Reuse
          - No Reuse
      availability_zones:
        description: "Enable zone redundancy (Premium only and where supported)"
        required: true
        type: boolean
        default: false
      pricing_plan:
        description: "ACR SKU"
        required: true
        type: choice
        options:
          - Basic
          - Standard
          - Premium
      role_assignment_permissions:
        description: "Repository authorization model"
        required: true
        type: choice
        options:
          - RBAC Registry + ABAC Repository Permissions
          - RBAC Registry Permissions

  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: acr-deployment-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: ${{ vars.TERRAFORM_WORKING_DIRECTORY || 'Azure_Container_Registry/deployment' }}

jobs:
  collect-inputs:
    name: Collect and validate request inputs
    runs-on: self-hosted
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'azure-acr-deployment')
    outputs:
      ritm: ${{ steps.inputs.outputs.ritm }}
      subscription_name: ${{ steps.inputs.outputs.subscription_name }}
      resource_group_name: ${{ steps.inputs.outputs.resource_group_name }}
      acr_name: ${{ steps.inputs.outputs.acr_name }}
      location: ${{ steps.inputs.outputs.location }}
      sku: ${{ steps.inputs.outputs.sku }}
      availability_zones: ${{ steps.inputs.outputs.availability_zones }}
      domain_label_scope: ${{ steps.inputs.outputs.domain_label_scope }}
      role_assignment_permissions: ${{ steps.inputs.outputs.role_assignment_permissions }}
    steps:
      - name: Parse and validate inputs
        id: inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          MANUAL_RITM: ${{ inputs.ritm }}
          MANUAL_SUBSCRIPTION: ${{ inputs.subscription_id }}
          MANUAL_RG: ${{ inputs.resource_group_name }}
          MANUAL_ACR: ${{ inputs.acr_name }}
          MANUAL_LOCATION: ${{ inputs.location }}
          MANUAL_DOMAIN: ${{ inputs.domain_label_scope }}
          MANUAL_ZONES: ${{ inputs.availability_zones }}
          MANUAL_SKU: ${{ inputs.pricing_plan }}
          MANUAL_ROLE: ${{ inputs.role_assignment_permissions }}
        run: |
          set -euo pipefail

          get_value() {
            local field="$1"
            printf '%s\n' "$ISSUE_BODY" | awk -v field="$field" '
              $0 == "### " field {
                while (getline > 0) {
                  if ($0 ~ /^### /) exit
                  if ($0 ~ /^[[:space:]]*$/) continue
                  print
                  exit
                }
              }
            '
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RITM="$MANUAL_RITM"
            SUBSCRIPTION="$MANUAL_SUBSCRIPTION"
            RG="$MANUAL_RG"
            ACR="$MANUAL_ACR"
            LOCATION="$MANUAL_LOCATION"
            DOMAIN="$MANUAL_DOMAIN"
            ZONES="$MANUAL_ZONES"
            SKU="$MANUAL_SKU"
            ROLE="$MANUAL_ROLE"
          else
            RITM="$(get_value 'RITM')"
            SUBSCRIPTION="$(get_value 'Subscription')"
            RG="$(get_value 'Resource Group Name')"
            ACR="$(get_value 'ACR Name')"
            LOCATION="$(get_value 'Location')"
            DOMAIN="$(get_value 'Domain Name Label Scope')"
            SKU="$(get_value 'Pricing Plan')"
            ROLE="$(get_value 'Role Assignment Permissions Mode')"

            if printf '%s\n' "$ISSUE_BODY" | grep -qiE '^- \[x\] Enable Availability Zones$'; then
              ZONES=true
            else
              ZONES=false
            fi

            if ! printf '%s\n' "$ISSUE_BODY" | grep -qiE '^- \[x\] I confirm that the target subscription, Resource Group, ACR name, SKU, and change request are correct\.$'; then
              echo "::error::Requester confirmation checkbox is not checked."
              exit 1
            fi
          fi

          for name in RITM SUBSCRIPTION RG ACR LOCATION DOMAIN SKU ROLE; do
            value="${!name}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "::error::$name is required."
              exit 1
            fi
          done

          [[ "$RITM" =~ ^RITM[0-9]+$ ]] || { echo "::error::RITM must look like RITM1234567."; exit 1; }
          [[ "$ACR" =~ ^[a-z0-9]{5,50}$ ]] || { echo "::error::ACR name must be 5-50 lowercase letters/numbers."; exit 1; }
          [[ "$ZONES" == "true" || "$ZONES" == "false" ]] || { echo "::error::Availability zones must be true/false."; exit 1; }
          [[ "$SKU" == "Basic" || "$SKU" == "Standard" || "$SKU" == "Premium" ]] || { echo "::error::Invalid ACR SKU."; exit 1; }
          if [[ "$ZONES" == "true" && "$SKU" != "Premium" ]]; then
            echo "::error::Availability zones require Premium SKU."; exit 1
          fi
          case "$SUBSCRIPTION" in
            "Azure subscription 1"|"FAAST NON_PROD"|"FAAST PROD"|"Data & Analysis PaaS Non-Prod"|"Data & Analysis PaaS Prod") ;;
            *) echo "::error::Unsupported subscription option."; exit 1 ;;
          esac
          case "$DOMAIN" in
            "Unsecure"|"Tenant Reuse"|"Subscription Reuse"|"Resource Group Reuse"|"No Reuse") ;;
            *) echo "::error::Invalid domain label scope."; exit 1 ;;
          esac
          case "$ROLE" in
            "RBAC Registry + ABAC Repository Permissions"|"RBAC Registry Permissions") ;;
            *) echo "::error::Invalid role assignment permissions mode."; exit 1 ;;
          esac

          case "$LOCATION" in
            "East US") LOCATION=eastus ;;
            "West US") LOCATION=westus ;;
            "Central US") LOCATION=centralus ;;
            "North Europe") LOCATION=northeurope ;;
            "West Europe") LOCATION=westeurope ;;
            "UK South") LOCATION=uksouth ;;
            "Southeast Asia") LOCATION=southeastasia ;;
            "Australia East") LOCATION=australiaeast ;;
            *) echo "::error::Unsupported Azure region."; exit 1 ;;
          esac

          {
            echo "ritm=$RITM"
            echo "subscription_name=$SUBSCRIPTION"
            echo "resource_group_name=$RG"
            echo "acr_name=$ACR"
            echo "location=$LOCATION"
            echo "sku=$SKU"
            echo "availability_zones=$ZONES"
            echo "domain_label_scope=$DOMAIN"
            echo "role_assignment_permissions=$ROLE"
          } >> "$GITHUB_OUTPUT"
          echo "Input validation passed for $RITM."

  resolve-subscription:
    name: Resolve Azure subscription ID
    runs-on: self-hosted
    needs: collect-inputs
    # This makes AZURE_SUBSCRIPTION_1_ID available if stored as an environment secret.
    environment:
      name: ${{ vars.AZURE_WORK_ENVIRONMENT || 'azure-acr-nonprod' }}
    outputs:
      subscription_id: ${{ steps.resolve.outputs.subscription_id }}
    steps:
      - name: Resolve configured subscription
        id: resolve
        shell: bash
        env:
          SELECTED_SUBSCRIPTION: ${{ needs.collect-inputs.outputs.subscription_name }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_1_ID }}
        run: |
          set -euo pipefail

          # Only this subscription ID secret has been configured so far.
          if [[ "$SELECTED_SUBSCRIPTION" != "Azure subscription 1" ]]; then
            echo "::error::Only 'Azure subscription 1' is configured. Add separate subscription ID secrets and mappings before selecting another subscription."
            exit 1
          fi

          if [[ ! "$AZURE_SUBSCRIPTION_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::AZURE_SUBSCRIPTION_1_ID is missing or is not a valid subscription GUID. Configure it as a repository or job-environment secret."
            exit 1
          fi

          echo "subscription_id=$AZURE_SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"
          echo "Subscription ID resolved successfully (value hidden)."

  terraform-init:
    name: Terraform init and validate
    runs-on: self-hosted
    needs: [collect-inputs, resolve-subscription]
    environment:
      name: ${{ vars.AZURE_WORK_ENVIRONMENT || 'azure-acr-nonprod' }}
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ needs.resolve-subscription.outputs.subscription_id }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
      TFSTATE_KEY: ${{ vars.TFSTATE_KEY || 'acr-nonprod.tfstate' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify required tools
        shell: bash
        run: |
          set -euo pipefail
          command -v unzip >/dev/null || { echo "::error::Install unzip on the self-hosted runner."; exit 1; }
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || '1.9.8' }}
          terraform_wrapper: false
      - name: Validate OIDC and backend configuration
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ARM_CLIENT_ID:?Missing AZURE_CLIENT_ID secret}"
          : "${ARM_TENANT_ID:?Missing AZURE_TENANT_ID secret}"
          : "${ARM_SUBSCRIPTION_ID:?Missing resolved Azure subscription ID}"
          : "${TFSTATE_RESOURCE_GROUP:?Missing TFSTATE_RESOURCE_GROUP repository/environment variable}"
          : "${TFSTATE_STORAGE_ACCOUNT:?Missing TFSTATE_STORAGE_ACCOUNT repository/environment variable}"
          : "${TFSTATE_CONTAINER:?Missing TFSTATE_CONTAINER repository/environment variable}"
          : "${TFSTATE_KEY:?Missing TFSTATE_KEY variable}"
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=$TFSTATE_KEY" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="tenant_id=$ARM_TENANT_ID" \
            -backend-config="client_id=$ARM_CLIENT_ID" \
            -backend-config="subscription_id=$ARM_SUBSCRIPTION_ID"
          terraform fmt -check -recursive
          terraform validate

  terraform-plan:
    name: Terraform plan
    runs-on: self-hosted
    needs: [collect-inputs, resolve-subscription, terraform-init]
    environment:
      name: ${{ vars.AZURE_WORK_ENVIRONMENT || 'azure-acr-nonprod' }}
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ needs.resolve-subscription.outputs.subscription_id }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
      TFSTATE_KEY: ${{ vars.TFSTATE_KEY || 'acr-nonprod.tfstate' }}
      # These names must match variables declared by the Terraform root module.
      TF_VAR_rg_name: ${{ needs.collect-inputs.outputs.resource_group_name }}
      TF_VAR_rg_location: ${{ needs.collect-inputs.outputs.location }}
      TF_VAR_acr_name: ${{ needs.collect-inputs.outputs.acr_name }}
      TF_VAR_sku_name: ${{ needs.collect-inputs.outputs.sku }}
      TF_VAR_zone_redundancy_enabled: ${{ needs.collect-inputs.outputs.availability_zones }}
      TF_VAR_domain_label_scope: ${{ needs.collect-inputs.outputs.domain_label_scope }}
      TF_VAR_role_assignment_permissions: ${{ needs.collect-inputs.outputs.role_assignment_permissions }}
      TF_VAR_admin_enabled: "false"
      TF_VAR_public_network_access_enabled: "true"
      TF_VAR_identity_type: "SystemAssigned"
      TF_VAR_tags: '{"managed_by":"github-actions","environment":"nonprod"}'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || '1.9.8' }}
          terraform_wrapper: false
      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=$TFSTATE_KEY" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="tenant_id=$ARM_TENANT_ID" \
            -backend-config="client_id=$ARM_CLIENT_ID" \
            -backend-config="subscription_id=$ARM_SUBSCRIPTION_ID"
      - name: Create saved Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          REQUEST_RITM: ${{ needs.collect-inputs.outputs.ritm }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Creating Terraform plan for request $REQUEST_RITM."
          terraform plan -input=false -lock-timeout=5m -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: acr-terraform-plan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          if-no-files-found: error
          retention-days: 1

  terraform-apply:
    name: Terraform apply (protected)
    runs-on: self-hosted
    needs: [collect-inputs, resolve-subscription, terraform-plan]
    environment:
      name: ${{ vars.AZURE_APPLY_ENVIRONMENT || 'azure-acr-nonprod-apply' }}
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ needs.resolve-subscription.outputs.subscription_id }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
      TFSTATE_KEY: ${{ vars.TFSTATE_KEY || 'acr-nonprod.tfstate' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || '1.9.8' }}
          terraform_wrapper: false
      - uses: actions/download-artifact@v4
        with:
          name: acr-terraform-plan
          path: ${{ env.TF_WORKING_DIR }}
      - name: Terraform init for saved plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ARM_CLIENT_ID:?Missing AZURE_CLIENT_ID secret}"
          : "${ARM_TENANT_ID:?Missing AZURE_TENANT_ID secret}"
          : "${ARM_SUBSCRIPTION_ID:?Missing resolved Azure subscription ID}"
          : "${TFSTATE_RESOURCE_GROUP:?Missing TFSTATE_RESOURCE_GROUP variable}"
          : "${TFSTATE_STORAGE_ACCOUNT:?Missing TFSTATE_STORAGE_ACCOUNT variable}"
          : "${TFSTATE_CONTAINER:?Missing TFSTATE_CONTAINER variable}"
          : "${TFSTATE_KEY:?Missing TFSTATE_KEY variable}"
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=$TFSTATE_KEY" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="tenant_id=$ARM_TENANT_ID" \
            -backend-config="client_id=$ARM_CLIENT_ID" \
            -backend-config="subscription_id=$ARM_SUBSCRIPTION_ID"
      - name: Apply saved Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f tfplan || { echo "::error::Saved tfplan artifact is missing."; exit 1; }
          terraform apply -input=false -lock-timeout=5m tfplan

  issue-result:
    name: Report deployment result on issue
    runs-on: self-hosted
    if: always() && github.event_name == 'issues' && needs.collect-inputs.result == 'success'
    needs: [collect-inputs, resolve-subscription, terraform-init, terraform-plan, terraform-apply]
    permissions:
      issues: write
      contents: read
    steps:
      - name: Comment deployment status
        uses: actions/github-script@v7
        env:
          INIT_RESULT: ${{ needs.terraform-init.result }}
          PLAN_RESULT: ${{ needs.terraform-plan.result }}
          APPLY_RESULT: ${{ needs.terraform-apply.result }}
          RITM: ${{ needs.collect-inputs.outputs.ritm }}
          ACR: ${{ needs.collect-inputs.outputs.acr_name }}
          RG: ${{ needs.collect-inputs.outputs.resource_group_name }}
        with:
          script: |
            const applyResult = process.env.APPLY_RESULT;
            const succeeded = applyResult === 'success';
            const body = [
              `## Azure Container Registry deployment ${succeeded ? 'succeeded' : 'failed'}`,
              '',
              `- **RITM:** ${process.env.RITM}`,
              `- **ACR:** ${process.env.ACR}`,
              `- **Resource Group:** ${process.env.RG}`,
              `- **Terraform init:** ${process.env.INIT_RESULT}`,
              `- **Terraform plan:** ${process.env.PLAN_RESULT}`,
              `- **Terraform apply:** ${applyResult}`,
              `- **Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
