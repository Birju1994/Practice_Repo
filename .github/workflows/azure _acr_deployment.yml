name: Azure Container Registry Deployment

on:
  workflow_dispatch:
    inputs:
      ritm:
        description: "RITM number for audit traceability"
        required: true
        type: string
      subscription_id:
        description: "Azure subscription alias configured in repository secrets"
        required: true
        type: choice
        options:
          - Azure subscription 1
          - FAAST NON_PROD
          - FAAST PROD
          - Data & Analysis PaaS Non-Prod
          - Data & Analysis PaaS Prod
      resource_group_name:
        description: "Existing Azure Resource Group name"
        required: true
        type: string
        default: GITHUB-AZURE-TEST-RG
      acr_name:
        description: "Globally unique ACR name (lowercase letters/numbers only)"
        required: true
        type: string
      location:
        description: "Azure region"
        required: true
        type: string
        default: eastus
      sku:
        description: "ACR SKU"
        required: true
        type: choice
        options: [Basic, Standard, Premium]
      availability_zones:
        description: "Enable zone redundancy (Premium SKU only where supported)"
        required: true
        type: boolean
        default: false
      domain_label_scope:
        description: "ACR login-server domain label scope"
        required: true
        type: choice
        options:
          - Unsecure
          - Tenant Reuse
          - Subscription Reuse
          - Resource Group Reuse
          - No Reuse
      role_assignment_permissions:
        description: "Repository authorization model"
        required: true
        type: choice
        options:
          - RBAC Registry + ABAC Repository Permissions
          - RBAC Registry Permissions

  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: acr-deployment-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false

env:
  AZURE_ENVIRONMENT: ${{ vars.AZURE_WORK_ENVIRONMENT || 'azure-acr-prod' }}
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_WORKING_DIR: ${{ vars.TERRAFORM_WORKING_DIRECTORY || 'Azure_Container_Registry/deployment' }}

jobs:
  collect-inputs:
    name: Collect and validate deployment inputs
    runs-on: self-hosted
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'azure-acr-deployment'))
    outputs:
      ritm: ${{ steps.inputs.outputs.ritm }}
      subscription_name: ${{ steps.inputs.outputs.subscription_name }}
      resource_group_name: ${{ steps.inputs.outputs.resource_group_name }}
      acr_name: ${{ steps.inputs.outputs.acr_name }}
      location: ${{ steps.inputs.outputs.location }}
      sku: ${{ steps.inputs.outputs.sku }}
      availability_zones: ${{ steps.inputs.outputs.availability_zones }}
      domain_label_scope: ${{ steps.inputs.outputs.domain_label_scope }}
      role_assignment_permissions: ${{ steps.inputs.outputs.role_assignment_permissions }}
    steps:
      - name: Read and validate inputs
        id: inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          MANUAL_RITM: ${{ inputs.ritm }}
          MANUAL_SUBSCRIPTION: ${{ inputs.subscription_id }}
          MANUAL_RG: ${{ inputs.resource_group_name }}
          MANUAL_ACR: ${{ inputs.acr_name }}
          MANUAL_LOCATION: ${{ inputs.location }}
          MANUAL_SKU: ${{ inputs.sku }}
          MANUAL_ZONES: ${{ inputs.availability_zones }}
          MANUAL_DOMAIN: ${{ inputs.domain_label_scope }}
          MANUAL_ROLE: ${{ inputs.role_assignment_permissions }}
        run: |
          set -euo pipefail

          get_value() {
            local field="$1"
            printf '%s\n' "$ISSUE_BODY" | awk -v field="$field" '
              $0 == "### " field { found=1; getline; while ($0 == "") getline; print; exit }
            '
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RITM="$MANUAL_RITM"
            SUBSCRIPTION="$MANUAL_SUBSCRIPTION"
            RG="$MANUAL_RG"
            ACR="$MANUAL_ACR"
            LOCATION="$MANUAL_LOCATION"
            SKU="$MANUAL_SKU"
            ZONES="$MANUAL_ZONES"
            DOMAIN="$MANUAL_DOMAIN"
            ROLE="$MANUAL_ROLE"
          else
            RITM="$(get_value 'RITM')"
            SUBSCRIPTION="$(get_value 'Subscription')"
            RG="$(get_value 'Resource Group Name')"
            ACR="$(get_value 'ACR Name')"
            LOCATION="$(get_value 'Location')"
            SKU="$(get_value 'Pricing Plan')"
            DOMAIN="$(get_value 'Domain Name Label Scope')"
            ROLE="$(get_value 'Role Assignment Permissions Mode')"
            if printf '%s' "$ISSUE_BODY" | grep -qiE '^- \[x\] Enable Availability Zones$'; then ZONES=true; else ZONES=false; fi
          fi

          for pair in "RITM:$RITM" "Subscription:$SUBSCRIPTION" "Resource Group:$RG" "ACR Name:$ACR" "Location:$LOCATION" "SKU:$SKU" "Role:$ROLE"; do
            if [[ -z "${pair#*:}" ]]; then echo "ERROR: $pair is required." >&2; exit 1; fi
          done
          [[ "$SKU" == "Basic" || "$SKU" == "Standard" || "$SKU" == "Premium" ]] || { echo "ERROR: Invalid SKU." >&2; exit 1; }
          [[ "$ZONES" == "true" || "$ZONES" == "false" ]] || { echo "ERROR: Availability Zones must be true/false." >&2; exit 1; }
          # Azure Container Registry names are 5-50 lowercase alphanumeric characters.
          [[ "$ACR" =~ ^[a-z0-9]{5,50}$ ]] || { echo "ERROR: ACR name must be 5-50 lowercase letters/numbers." >&2; exit 1; }
          if [[ "$ZONES" == "true" && "$SKU" != "Premium" ]]; then
            echo "ERROR: Zone redundancy requires Premium SKU. Choose Premium or disable zones." >&2
            exit 1
          fi

          {
            echo "ritm=$RITM"
            echo "subscription_name=$SUBSCRIPTION"
            echo "resource_group_name=$RG"
            echo "acr_name=$ACR"
            echo "location=$LOCATION"
            echo "sku=$SKU"
            echo "availability_zones=$ZONES"
            echo "domain_label_scope=$DOMAIN"
            echo "role_assignment_permissions=$ROLE"
          } >> "$GITHUB_OUTPUT"

          echo "Input validation passed for RITM $RITM."
      - name: Install unzip
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -v

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
  resolve-subscription:
    name: Resolve Azure subscription
    runs-on: self-hosted
    needs: collect-inputs
    outputs:
      subscription_id: ${{ steps.map.outputs.subscription_id }}
    steps:
      - name: Map subscription alias to ID
        id: map
        shell: bash
        env:
          SELECTED_SUBSCRIPTION: ${{ needs.collect-inputs.outputs.subscription_name }}
          SUB_AZURE_1: ${{ secrets.AZURE_SUBSCRIPTION_1_ID }}
          SUB_FAAST_NONPROD: ${{ secrets.FAAST_NONPROD_SUBSCRIPTION_ID }}
          SUB_FAAST_PROD: ${{ secrets.FAAST_PROD_SUBSCRIPTION_ID }}
          SUB_DATA_NONPROD: ${{ secrets.DATA_PAAS_NONPROD_SUBSCRIPTION_ID }}
          SUB_DATA_PROD: ${{ secrets.DATA_PAAS_PROD_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          case "$SELECTED_SUBSCRIPTION" in
            "Azure subscription 1") SUBSCRIPTION_ID="$SUB_AZURE_1" ;;
            "FAAST NON_PROD") SUBSCRIPTION_ID="$SUB_FAAST_NONPROD" ;;
            "FAAST PROD") SUBSCRIPTION_ID="$SUB_FAAST_PROD" ;;
            "Data & Analysis PaaS Non-Prod") SUBSCRIPTION_ID="$SUB_DATA_NONPROD" ;;
            "Data & Analysis PaaS Prod") SUBSCRIPTION_ID="$SUB_DATA_PROD" ;;
            *) echo "ERROR: Unsupported subscription alias." >&2; exit 1 ;;
          esac
          [[ -n "$SUBSCRIPTION_ID" ]] || { echo "ERROR: Secret for selected subscription is empty or missing." >&2; exit 1; }
          echo "subscription_id=$SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"

  terraform-init:
    name: Terraform init and validate
    runs-on: self-hosted
    needs: [collect-inputs, resolve-subscription]
    environment:
      name: ${{ vars.AZURE_WORK_ENVIRONMENT || 'azure-acr-prod' }}
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_1_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
      TFSTATE_KEY: ${{ vars.TFSTATE_KEY || 'acr-nonprod.tfstate' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || '1.9.8' }}

      - name: Terraform init (remote Azure state via OIDC)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          : "${ARM_CLIENT_ID:?Set repository/environment secret AZURE_CLIENT_ID}"
          : "${ARM_TENANT_ID:?Set repository/environment secret AZURE_TENANT_ID}"
          : "${ARM_SUBSCRIPTION_ID:?repository/environment secrets.AZURE_SUBSCRIPTION_1_ID}"
          : "${TFSTATE_RESOURCE_GROUP:?Set variable TFSTATE_RESOURCE_GROUP}"
          : "${TFSTATE_STORAGE_ACCOUNT:?Set variable TFSTATE_STORAGE_ACCOUNT}"
          : "${TFSTATE_CONTAINER:?Set variable TFSTATE_CONTAINER}"
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=$TFSTATE_KEY" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="tenant_id=$ARM_TENANT_ID" \
            -backend-config="client_id=$ARM_CLIENT_ID" \
            -backend-config="subscription_id=$ARM_SUBSCRIPTION_ID"
          terraform fmt -check -recursive
          terraform validate

  terraform-plan:
    name: Terraform plan
    runs-on: self-hosted
    needs: [collect-inputs, resolve-subscription, terraform-init]
    environment:
      name: ${{ vars.AZURE_WORK_ENVIRONMENT || 'azure-acr-prod' }}
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_1_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
      TFSTATE_KEY: ${{ vars.TFSTATE_KEY || 'acr-prod.tfstate' }}
      TF_VAR_rg_name: ${{ needs.collect-inputs.outputs.resource_group_name }}
      TF_VAR_rg_location: ${{ needs.collect-inputs.outputs.location }}
      TF_VAR_acr_name: ${{ needs.collect-inputs.outputs.acr_name }}
      TF_VAR_sku_name: ${{ needs.collect-inputs.outputs.sku }}
      TF_VAR_zone_redundancy_enabled: ${{ needs.collect-inputs.outputs.availability_zones }}
      TF_VAR_tags: '{"managed_by":"github-actions","environment":"prod"}'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || '1.9.8' }}
      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=$TFSTATE_KEY" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="tenant_id=$ARM_TENANT_ID" \
            -backend-config="client_id=$ARM_CLIENT_ID" \
            -backend-config="subscription_id=$ARM_SUBSCRIPTION_ID"
      - name: Create Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          REQUEST_RITM: ${{ needs.collect-inputs.outputs.ritm }}
          REQUEST_DOMAIN_SCOPE: ${{ needs.collect-inputs.outputs.domain_label_scope }}
          REQUEST_ROLE_MODE: ${{ needs.collect-inputs.outputs.role_assignment_permissions }}
        run: |
          set -euo pipefail
          # These two values are recorded as tags for traceability. The Terraform
          # root module must declare the variables listed in TF_VAR_* above.
          echo "Planning ACR deployment for RITM: $REQUEST_RITM"
          terraform plan -input=false -lock-timeout=5m -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: acr-terraform-plan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          if-no-files-found: error
          retention-days: 1

  terraform-apply:
    name: Terraform apply (protected)
    runs-on: self-hosted
    needs: [collect-inputs, resolve-subscription, terraform-plan]
    # Configure required reviewers on this GitHub Environment to require approval.
    environment:
      name: ${{ vars.AZURE_APPLY_ENVIRONMENT || 'azure-acr-prod-apply' }}
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: secrets.AZURE_SUBSCRIPTION_1_ID
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
      TFSTATE_KEY: ${{ vars.TFSTATE_KEY || 'acr-prod.tfstate' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || '1.9.8' }}
      - uses: actions/download-artifact@v4
        with:
          name: acr-terraform-plan
          path: ${{ env.TF_WORKING_DIR }}
      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=$TFSTATE_KEY" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="tenant_id=$ARM_TENANT_ID" \
            -backend-config="client_id=$ARM_CLIENT_ID" \
            -backend-config="subscription_id=$ARM_SUBSCRIPTION_ID"
      - name: Apply reviewed Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -lock-timeout=5m tfplan

  issue-result:
    name: Update issue with deployment result
    runs-on: self-hosted
    if: always() && github.event_name == 'issues' && needs.collect-inputs.result == 'success'
    needs: [collect-inputs, terraform-apply]
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        env:
          APPLY_RESULT: ${{ needs.terraform-apply.result }}
          RITM: ${{ needs.collect-inputs.outputs.ritm }}
          ACR: ${{ needs.collect-inputs.outputs.acr_name }}
          RG: ${{ needs.collect-inputs.outputs.resource_group_name }}
        with:
          script: |
            const succeeded = process.env.APPLY_RESULT === 'success';
            const body = `## Azure Container Registry deployment ${succeeded ? 'succeeded' : 'failed'}

            - **RITM:** ${process.env.RITM}
            - **ACR:** ${process.env.ACR}
            - **Resource Group:** ${process.env.RG}
            - **Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
            - **Status:** ${process.env.APPLY_RESULT}
            `;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
