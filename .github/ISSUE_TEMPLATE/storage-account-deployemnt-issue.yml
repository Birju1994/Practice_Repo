name: Azure Storage Account Deployment Issue
description: Request deployment of an Azure Storage Account
title: "[Storage Account - Deployment]"
labels: 
  - create-azure-storage

body:
  - type: markdown
    attributes:
       value: |
          ### Azure Web App - Deployment 
          Fill in the fields below to deploy and Azure Web App.
  - type: input
    id: RITM
    attributes:
      label: RITM
      description: "RITM number for audit tracebility. Example: RITM1234567"
      placeholder: "RITM1234567"
      value: RITM1234567
    validations:
      required: true
  - type: dropdown
    id: subscription_id
    attributes:
       label: subscription_id
       description: "Select subscription from the given list"
       options:
         - FAAST NON-PROD
         - FAAST PROD
         - Data & Analytics PaaS Non-Prod
         - Data & Analytics PaaS Prod
       default: 0

  - type: input
    id: storage_account_name
    attributes:
      label: storage_account_name
      description: "Storage account name to be created. Must be unique across Azure."
        Format: az{yy}{appid}stg{nn}{env}
        - yy = year (e.g., 26 for 2026)
        - appid = 2-10 lowercase characters (letters and numbers allowed)
        - nn = instance number (e.g., 01, 02, etc.)
        - env = environment (e.g., p for production, np for non-production)
      placeholder: az26myappstg01p
      value: az26myappstg01p
    validations:
      required: true
   
      
