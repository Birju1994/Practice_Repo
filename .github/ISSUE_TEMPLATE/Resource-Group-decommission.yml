name: Resource Group Decommission
description: Request to decommission an Azure Resource Group
title: "[Decommission] "
labels:
  - decommission

body:

  - type: input
    id: resource-group
    attributes:
      label: Resource Group
      description: Enter the name of the Azure Resource Group to be decommissioned.
      placeholder: "rg-example-dev"
    validations:
      required: true

  - type: dropdown
    id: location
    attributes:
      label: Location
      description: Select the Azure region where the Resource Group is located.
      options:
        - East US
        - West US
        - Central US
        - North Europe
        - West Europe
        - UK South
        - Southeast Asia
        - Australia East
        - Other
    validations:
      required: true

  - type: input
    id: ritm
    attributes:
      label: RITM
      description: Enter the RITM number associated with this decommission request.
      placeholder: "RITM1234567"
    validations:
      required: true

  - type: input
    id: dso
    attributes:
      label: DSO
      description: Enter the DSO details.
      placeholder: "Enter DSO"
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      description: Please confirm before submitting the decommission request.
      options:
        - label: I confirm that the above Resource Group is approved for decommissioning.
          required: true
