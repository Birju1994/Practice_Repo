name: Azure Container Registry
description: Request deployment of an Azure Container Registry
title: "Azure Container Registry - Deployment"
labels:
  - azure-acr-deployment

body:
  - type: markdown
    attributes:
      value: |
        ### Azure Container Registry Deployment Request
        Fill in the fields below to deploy an Azure Container Registry via automation workflow.
        Execution starts when this issue gets the label **azure-acr-deployment**.

  - type: input
    id: ritm
    attributes:
      label: RITM
      description: "RITM number for audit traceability. Example: RITM1234567"
      placeholder: RITM1234567
    validations:
      required: true

  - type: dropdown
    id: dso
    attributes:
       label: DSO
       description: "Operation ownership for this resources"
       options:
         - Client
         - Selftest
       default: 1
    validations:
      required: true

  - type: dropdown
    id: subscription_id
    attributes:
      label: subscription_id
      description: Select the Azure subscription.
      options:
        - FAAST NON_PROD
        - FAAST PROD
        - Data & Analysis PaaS Non-Prod
        - Data & Analysis PaaS Prod
        - SUB_AZURE_1
    validations:
      required: true

  - type: input
    id: resource_group_name
    attributes:
      label: resource_group_name
      description: "Resource group that must already exist in the selected subscription."
      placeholder: AZ26P1-ACR-RG01
    validations:
      required: true

  - type: input
    id: acr_name
    attributes:
      label: acr_name
      description: |
        Format: az{yy}{appid}acr{nn}{env}
        - yy = year (e.g., 26 for 2026)
        - appid = application identifier
        - acr = resource type
        - nn = instance number
        - env = dev, test, uat, or prod
        Example: az26githubacr01dev
      placeholder: az26githubacr01dev
      value: az26githubacr01dev
    validations:
      required: true

  - type: dropdown
    id: location
    attributes:
      label: location
      description: Select the Azure region for the ACR.
      options:
        - East US
        - West US
        - Central US
        - Central India
        - North Europe
        - West Europe
        - UK South
        - Southeast Asia
        - Australia East
    validations:
      required: true

  - type: dropdown
    id: network_access
    attributes:
      label: network_access
      description: Select the ACR connectivity model.
      options:
        - Public Endpoint
        - Private Endpoint
    validations:
      required: true

  - type: dropdown
    id: public_network_access
    attributes:
      label: public_network_access
      description: |
        Select the public network access setting:
        - All networks: Allow public endpoint access from all networks.
        - Selected networks: Allow public endpoint access only from configured firewall IP ranges.
        - Disabled: Disable public endpoint access.
      options:
        - All networks
        - Selected networks
        - Disabled
    validations:
      required: true

  - type: textarea
    id: allowed_ip_ranges
    attributes:
      label: allowed_ip_ranges
      description: |
        Required when public_network_access is Selected networks.
        Enter public IPv4 addresses or CIDR ranges, one per line.
        Example: YOUR_PUBLIC_IP/32
        Leave blank for All networks or Disabled.
      placeholder: |
        203.0.113.10/32
        198.51.100.0/24
      render: text
    validations:
      required: false

  - type: dropdown
    id: domain_label_scope
    attributes:
      label: domain_label_scope
      description: Select the required domain name label scope.
      options:
        - Unsecure
        - Tenant Reuse
        - Subscription Reuse
        - Resource Group Reuse
        - No Reuse
    validations:
      required: true

  - type: checkboxes
    id: availability_zones
    attributes:
      label: availability_zones
      description: Enable availability zones if supported by the selected SKU and region.
      options:
        - label: Enable Availability Zones
          required: false

  - type: dropdown
    id: sku
    attributes:
      label: sku
      description: Select the ACR SKU.
      options:
        - Basic
        - Standard
        - Premium
    validations:
      required: true

  - type: dropdown
    id: role_assignment_permissions
    attributes:
      label: role_assignment_permissions
      description: Select the required repository authorization model.
      options:
        - RBAC Registry + ABAC Repository Permissions
        - RBAC Registry Permissions
    validations:
      required: true
