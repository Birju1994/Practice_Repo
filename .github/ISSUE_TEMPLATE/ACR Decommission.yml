name: Azure Container Registry Deployment
description: Request deployment of an Azure Container Registry
title: "Azure Container Registry - Deployment"
labels:
  - azure-acr-deployment

body:
  - type: markdown
    attributes:
      value: |
        ### Azure Container Registry Deployment Request 
        Fil in the fields below to deploy an Azure Container Registry via automation workflow.
        Execution starts when this issue gets the lable **azure-acr-deployment**.

  - type: input
    id: ritm
    attributes:
      label: RITM 
      description: " RITM number for audit traceability. Example: RITM1234567"
      placeholder: RITM1234567
    validations:
      required: true

  - type: dropdown
    id: subscription_id
    attributes:
      label: subscription_id
      description: "Select the azure subscription from the given list."
      options:
        - FAAST NON_PROD
        - FAAST PROD
        - Data & Analysis PaaS Non-Prod
        - Data & Analysis PaaS Prod
      default: 0

  - type: input
    id: resource_group_name
    attributes:
      label: resource_group_name
      description: "Must already exit in the selected subscription."
      placeholder: AZ26P1-ACR-R01
    validations:
      required: true

  - type: input
    id: registry_name
    attributes:
      label: registry_name
      description: |
        Format: az{yy}{appid}acr{nn}{env}
        - yy = year (e.g., 26 for 2026)
        - appid = 2-10 lowercase characters (letters and numbers allowed)
        - acr = Fixed resource type
        - {nn} = instance number (e.g., 01,02)
        - env = environment (dev = development, test = testing, uat = user acceptance testing, prod = production)
        Example: az26githubacr01dev
      placeholder: az26githubacr01dev
      value: az26githubacr01dev
    validations:
      required: true
      
      
